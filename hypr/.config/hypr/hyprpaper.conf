# hyprpaper — https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/
# hyprpaper 0.8+ uses the block syntax below; the old
# "preload =" / "wallpaper =" keyword form was removed.

wallpaper {
    monitor =                                       # empty = all outputs
    path = ~/.config/hypr/wallpaper/blame.jpg
}

splash = false
ipc = on
