###############
### MONITORS ###
###############

monitor = ,preferred,auto,1.2


###################
### MY PROGRAMS ###
###################

$terminal    = kitty
$fileManager = thunar
$menu        = rofi -show drun
$browser     = firefox
$scrPath     = scripts/


#################
### AUTOSTART ###
#################

exec-once = nm-applet &
exec-once = waybar
exec-once = hyprpaper
exec-once = systemctl --user enable --now opentabletdriver.service

# Polkit authentication agent (privilege prompts for GUI apps)
exec-once = systemctl --user start hyprpolkitagent.service

# Clipboard history watcher (feeds SUPER+V / cliphist.sh)
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store


#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct


#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in  = 0
    gaps_out = 0

    border_size = 2

    col.active_border   = rgb(eee0b7)
    col.inactive_border = rgb(3c3836)

    resize_on_border = false
    allow_tearing    = false

    layout = dwindle
}

decoration {
    rounding       = 0
    rounding_power = 2

    active_opacity   = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled      = false
        range        = 4
        render_power = 3
        color        = rgba(1a1a1aee)
    }

    blur {
        enabled  = false
        size     = 3
        passes   = 1
        vibrancy = 0.1696
    }
}

animations {
    enabled = false
}

dwindle {
    # pseudotile убран в 0.55 — используй биндинг SUPER+P (dispatcher pseudo)
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo   = true
    vrr                     = 0
}


#############
### INPUT ###
#############

input {
    kb_layout  = us, ru
    kb_options = grp:alt_shift_toggle

    follow_mouse = 1

    # Отключение ускорения тачпада (и мыши)
    # flat     = линейная скорость, без ускорения
    # adaptive = стандартное libinput ускорение (дефолт)
    accel_profile = flat
    sensitivity   = 0

    touchpad {
        natural_scroll       = true
        disable_while_typing = false
        clickfinger_behavior = true
        tap-and-drag         = true
    }
}

gestures {
    gesture = 3, horizontal, workspace
    gesture = 4, up, dispatcher, exec, $menu
    gesture = 3, pinchout, float, float
    gesture = 3, pinchin,  float, tile
}

device {
    name        = epic-mouse-v1
    sensitivity = -0.5
}

xwayland {
    force_zero_scaling = true
}


###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

bind = $mainMod,       T, exec,          $terminal
bind = $mainMod,       Q, killactive
bind = $mainMod,       M, exit
bind = $mainMod,       F, exec,          $browser
bind = $mainMod,       E, exec,          $fileManager
bind = $mainMod,       W, togglefloating
bind = $mainMod,       A, exec,          $menu
bind = $mainMod,       C, exec,          code
bind = $mainMod,       P, pseudo         # dispatcher жив, опция dwindle.pseudotile убрана

# togglesplit убран как прямой диспатчер в 0.55 → теперь через layoutmsg
bind = $mainMod,       J, layoutmsg,     togglesplit

bind = $mainMod,       V, exec,          pkill -x rofi || $scrPath/cliphist.sh -c
bind = $mainMod,       G, togglegroup
bind = $mainMod SHIFT, P, exec, ~/.config/hypr/scripts/screenshot.sh s        

bindm = $mainMod, Z, movewindow
bindm = $mainMod, X, resizewindow

# Фокус
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Воркспейсы
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Скрэтчпад
bind = $mainMod,       S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace,        special:magic

# Скролл воркспейсов мышью
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# Перетаскивание / ресайз мышью
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Мультимедиа / яркость
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPrev,  exec, playerctl previous


##############################
### WINDOWS AND WORKSPACES ###
##############################

 
windowrule {
    name             = fix-xwayland-drags
    match:class      = ^$
    match:title      = ^$
    match:xwayland   = true
    match:float      = true
    match:fullscreen = false
    match:pin        = false
    no_focus         = true
}

windowrule {
    name  = float-screenshot
    match:title = ^(Save screenshot)
    float = true
}

windowrule {
    name  = float-friends-list
    match:title = ^(Friends List)
    float = true
    size  = monitor_w*0.20 monitor_h*0.66
}

windowrule {
    name  = float-blueman
    match:class = blueman-manager
    float = true
    size  = monitor_w*0.25 monitor_h*0.25
    move  = monitor_w-(monitor_w*0.25)-26 28
}

windowrule {
    name   = float-thunar
    match:class = ^([Tt]hunar)
    float  = true
    size   = monitor_w*0.38 monitor_h*0.50
    center = true
}

windowrule {
    name  = float-throne
    match:class = Throne
    float = true
}

windowrule {
    name  = pip
    match:title = Picture-in-Picture
    float = true
    pin   = true
}

windowrule {
    name   = float-kitty
    match:class = kitty
    float  = true
    size   = monitor_w*0.46875 monitor_h*0.75
    center = true
}

windowrule {
    name           = suppress-maximize
    match:class    = .*
    suppress_event = maximize
}
